name: "Setup Python environment"
description: "Install uv, Python, and sync dependencies"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install
      shell: bash

    - name: Install dependencies
      run: make sync
      shell: bash
