[project]
name = "specguard"
version = "0.1.0"
description = "Measures how LLMs extract business rules from conversations, and how reliable LLM judges are."
readme = "README.md"
authors = [
    { name = "Carlos Serra-Toro", email = "carlosserratoro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "instructor[litellm]>=1.15.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=2.4.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff
    "PLE", # pylint errors
    "TID", # flake8-tidy-imports

]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["specguard"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "external: Tests that hit external services, e.g. live LLM calls",
]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:litellm._service_logger",
]

[tool.pyright]
extraPaths = ["scripts"]
